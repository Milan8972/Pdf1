name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
          RAW_VERSION="$(printf '%s\n' "${JAVA_VERSION_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"

          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Failed to detect the active Java version from 'java -version'."
            exit 1
          fi

          case "${RAW_VERSION}" in
            1.*)
              MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f2)"
              ;;
            *)
              MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f1 | sed 's/[^0-9].*//')"
              ;;
          esac

          if ! printf '%s' "${MAJOR_VERSION}" | grep -Eq '^[0-9]+$'; then
            echo "::error::Failed to parse the active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 21 ]; then
            echo "::error::Java 21 or newer is required for Gradle 9.3.1 / AGP 9.1.1, but detected Java ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi

      - name: Set up Android SDK (API 36.1 & Build Tools 36.0.0)
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${SDK_DIR}" ]; then
            echo "::error::Android SDK directory not found at ${SDK_DIR}."
            exit 1
          fi

          echo "ANDROID_HOME=${SDK_DIR}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "${GITHUB_ENV}"

          SDKMANAGER_BIN=""
          for candidate in \
            "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_DIR}"/cmdline-tools/*/bin/sdkmanager \
            "${SDK_DIR}/tools/bin/sdkmanager"; do
            if [ -x "${candidate}" ]; then
              SDKMANAGER_BIN="${candidate}"
              break
            fi
          done

          if [ -z "${SDKMANAGER_BIN}" ]; then
            echo "::error::sdkmanager binary not found under ${SDK_DIR}."
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER_BIN}"
          set +o pipefail
          yes | "${SDKMANAGER_BIN}" --sdk_root="${SDK_DIR}" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "${SDKMANAGER_BIN}" --sdk_root="${SDK_DIR}" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

          echo "Installed Android platforms:"
          ls -1 "${SDK_DIR}/platforms" || true
          echo "Installed Android build-tools:"
          ls -1 "${SDK_DIR}/build-tools" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare optional Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "app/google-services.json" ] && [ -s "app/google-services.json" ]; then
            echo "Found app/google-services.json in repository."
          elif [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secrets."
          else
            echo "::notice::app/google-services.json not present and GOOGLE_SERVICES_JSON_BASE64 secret not set. Building offline-capable APK/AAB without Firebase config."
          fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYSTORE_B64="./debug.keystore.base64"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [ ! -x "${KEYTOOL_BIN}" ]; then
            echo "::error::keytool was not found in the configured Java 21 installation (${JAVA_HOME})."
            exit 1
          fi

          if [ -f "${KEYSTORE_PATH}" ] && [ -s "${KEYSTORE_PATH}" ]; then
            echo "Existing debug keystore detected; skipping generation."
          elif [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Decoding DEBUG_KEYSTORE_BASE64 from GitHub Secrets..."
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          elif [ -f "${KEYSTORE_B64}" ] && [ -s "${KEYSTORE_B64}" ]; then
            echo "Decoding committed debug.keystore.base64 for Firebase SHA-1 parity..."
            base64 -d "${KEYSTORE_B64}" > "${KEYSTORE_PATH}"
          else
            echo "Generating temporary debug keystore..."
            if ! "${KEYTOOL_BIN}" -genkeypair \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary debug keystore."
              exit 1
            fi
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Debug keystore is missing or empty after preparation."
            exit 1
          fi

          echo "Debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          fi
          "${GRADLE_CMD}" :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              FOUND_APKS="$(find app/build/outputs/apk -type f -name '*.apk' | sort || true)"
              if [ -n "${FOUND_APKS}" ]; then
                printf '%s\n' "${FOUND_APKS}"
              else
                echo "(none)"
              fi
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build debug AAB
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          fi
          "${GRADLE_CMD}" :app:bundleDebug \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify debug AAB
        id: verify_aab
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_AAB="app/build/outputs/bundle/debug/app-debug.aab"

          if [ ! -e "${EXPECTED_AAB}" ]; then
            echo "::error::Expected debug AAB not found at ${EXPECTED_AAB}."
            if [ -d "app/build/outputs/bundle" ]; then
              echo "Discovered AAB files inside app/build/outputs/bundle:"
              FOUND_AABS="$(find app/build/outputs/bundle -type f -name '*.aab' | sort || true)"
              if [ -n "${FOUND_AABS}" ]; then
                printf '%s\n' "${FOUND_AABS}"
              else
                echo "(none)"
              fi
            else
              echo "Directory app/build/outputs/bundle does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_AAB}" ]; then
            echo "::error::${EXPECTED_AAB} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_AAB}" ]; then
            echo "::error::${EXPECTED_AAB} is empty."
            exit 1
          fi

          case "${EXPECTED_AAB}" in
            *.aab) ;;
            *)
              echo "::error::${EXPECTED_AAB} does not have the .aab extension."
              exit 1
              ;;
          esac

          echo "Verified debug AAB: ${EXPECTED_AAB} ($(stat -c%s "${EXPECTED_AAB}") bytes)"

      - name: Upload debug AAB artifact
        id: upload_aab_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare APK and AAB release assets
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE_AAB="app/build/outputs/bundle/debug/app-debug.aab"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is unavailable for release preparation."
            exit 1
          fi

          if [ ! -f "${SOURCE_AAB}" ] || [ ! -s "${SOURCE_AAB}" ]; then
            echo "::error::Verified debug AAB is unavailable for release preparation."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "${RAW_REPO_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[._-]+//; s/[._-]+$//')"

          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          AAB_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.aab"
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"
          AAB_ASSET_PATH="${RELEASE_DIR}/${AAB_ASSET_NAME}"

          cp "${SOURCE_APK}" "${ASSET_PATH}"
          cp "${SOURCE_AAB}" "${AAB_ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to copy debug APK to temporary release directory."
            exit 1
          fi

          if [ ! -f "${AAB_ASSET_PATH}" ] || [ ! -s "${AAB_ASSET_PATH}" ]; then
            echo "::error::Failed to copy debug AAB to temporary release directory."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "aab_asset_path=${AAB_ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "aab_asset_name=${AAB_ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release assets: ${ASSET_NAME}, ${AAB_ASSET_NAME}"

      - name: Publish APK and AAB to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          AAB_ASSET_PATH: ${{ steps.prepare_release_asset.outputs.aab_asset_path }}
          AAB_ASSET_NAME: ${{ steps.prepare_release_asset.outputs.aab_asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh --version; then
            echo "::warning::GitHub CLI (gh) is not available. Skipping GitHub Release publishing."
            exit 1
          fi

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::warning::Prepared APK release asset is missing or empty. Skipping GitHub Release publishing."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared APK release asset does not have a .apk extension. Skipping GitHub Release publishing."
              exit 1
              ;;
          esac

          if [ -z "${AAB_ASSET_PATH}" ] || [ ! -f "${AAB_ASSET_PATH}" ] || [ ! -s "${AAB_ASSET_PATH}" ]; then
            echo "::warning::Prepared AAB release asset is missing or empty. Skipping GitHub Release publishing."
            exit 1
          fi

          case "${AAB_ASSET_PATH}" in
            *.aab) ;;
            *)
              echo "::warning::Prepared AAB release asset does not have a .aab extension. Skipping GitHub Release publishing."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK and debug AAB built by GitHub Actions.

          - **Workflow run number:** ${GITHUB_RUN_NUMBER}
          - **Workflow run attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source commit SHA:** ${GITHUB_SHA}
          - **APK asset:** \`${ASSET_NAME}\`
          - **AAB asset:** \`${AAB_ASSET_NAME}\`

          **Important notes:**
          - These debug builds are intended for testing only.
          - They are **not** a Google Play Store production release.
          - Both files are signed only with a temporary debug keystore generated on the workflow runner.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" "${AAB_ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "${RELEASE_NOTES}"

      - name: Report APK download result
        if: ${{ !cancelled() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          AAB_ASSET_NAME: ${{ steps.prepare_release_asset.outputs.aab_asset_name }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_CONFIRMED="false"
          RELEASE_URL=""

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [ -n "${RELEASE_URL}" ]; then
              RELEASE_CONFIRMED="true"
            fi
          fi

          if [ "${RELEASE_CONFIRMED}" = "true" ]; then
            echo "GitHub Release published successfully."
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK asset filename: ${ASSET_NAME}"
            echo "AAB asset filename: ${AAB_ASSET_NAME}"

            {
              echo "## Debug APK & AAB Download"
              echo ""
              echo "The debug APK and debug AAB were built and published to GitHub Releases."
              echo ""
              echo "- **Release title:** ${RELEASE_TITLE}"
              echo "- **Release tag:** \`${RELEASE_TAG}\`"
              echo "- **APK asset:** \`${ASSET_NAME}\`"
              echo "- **AAB asset:** \`${AAB_ASSET_NAME}\`"
              echo "- **Release page:** ${RELEASE_URL}"
              echo ""
              echo "Open the release page above to download \`${ASSET_NAME}\` or \`${AAB_ASSET_NAME}\` directly from the **Assets** section."
              echo ""
              echo "The standard GitHub Actions artifacts (\`app-debug-apk\` and \`app-debug-aab\`) are also available on this workflow run as backups."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK and AAB builds succeeded and the GitHub Actions artifacts 'app-debug-apk' and 'app-debug-aab' remain available for download."

            {
              echo "## Debug APK & AAB Download (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases did not succeed."
              echo ""
              echo "The debug APK and debug AAB builds **succeeded**, and the GitHub Actions artifacts named \`app-debug-apk\` and \`app-debug-aab\` remain available for download on this workflow run as backups."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
