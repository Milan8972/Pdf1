name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
          RAW_VERSION="$(printf '%s\n' "${JAVA_VERSION_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"

          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Failed to detect the active Java version from 'java -version'."
            exit 1
          fi

          case "${RAW_VERSION}" in
            1.*)
              MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f2)"
              ;;
            *)
              MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f1 | sed 's/[^0-9].*//')"
              ;;
          esac

          if ! printf '%s' "${MAJOR_VERSION}" | grep -Eq '^[0-9]+$'; then
            echo "::error::Failed to parse the active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [ ! -x "${KEYTOOL_BIN}" ]; then
            echo "::error::keytool was not found in the configured Java 17 installation (${JAVA_HOME})."
            exit 1
          fi

          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Existing debug keystore detected; skipping generation."
          else
            if ! "${KEYTOOL_BIN}" -genkeypair \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary debug keystore."
              exit 1
            fi
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Temporary debug keystore is missing or empty after generation."
            exit 1
          fi

          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              FOUND_APKS="$(find app/build/outputs/apk -type f -name '*.apk' | sort || true)"
              if [ -n "${FOUND_APKS}" ]; then
                printf '%s\n' "${FOUND_APKS}"
              else
                echo "(none)"
              fi
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is unavailable for release preparation."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "${RAW_REPO_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[._-]+//; s/[._-]+$//')"

          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"

          cp "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to copy debug APK to temporary release directory."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh --version; then
            echo "::warning::GitHub CLI (gh) is not available. Skipping GitHub Release publishing."
            exit 1
          fi

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::warning::Prepared release asset is missing or empty. Skipping GitHub Release publishing."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have a .apk extension. Skipping GitHub Release publishing."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow run number:** ${GITHUB_RUN_NUMBER}
          - **Workflow run attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source commit SHA:** ${GITHUB_SHA}
          - **APK asset:** \`${ASSET_NAME}\`

          **Important notes:**
          - This APK is intended for testing only.
          - This APK is **not** a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore generated on the workflow runner.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "${RELEASE_NOTES}"

      - name: Report APK download result
        if: ${{ !cancelled() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_CONFIRMED="false"
          RELEASE_URL=""

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [ -n "${RELEASE_URL}" ]; then
              RELEASE_CONFIRMED="true"
            fi
          fi

          if [ "${RELEASE_CONFIRMED}" = "true" ]; then
            echo "GitHub Release published successfully."
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK asset filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Download"
              echo ""
              echo "The debug APK was built and published to GitHub Releases."
              echo ""
              echo "- **Release title:** ${RELEASE_TITLE}"
              echo "- **Release tag:** \`${RELEASE_TAG}\`"
              echo "- **APK asset:** \`${ASSET_NAME}\`"
              echo "- **Release page:** ${RELEASE_URL}"
              echo ""
              echo "Open the release page above and download \`${ASSET_NAME}\` directly from the **Assets** section."
              echo ""
              echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "## Debug APK Download (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases did not succeed."
              echo ""
              echo "The debug APK build **succeeded**, and the GitHub Actions artifact named \`app-debug-apk\` remains available for download on this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
