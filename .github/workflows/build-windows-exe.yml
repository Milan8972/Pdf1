name: Build and Publish Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build and Publish paperpilot Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Windows desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt

      - name: Generate Windows EXE icon
        shell: pwsh
        run: python windows/make_icon.py

      - name: Build standalone paperpilot.exe
        shell: pwsh
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name paperpilot `
            --icon paperpilot.ico `
            --collect-all customtkinter `
            --collect-all fitz `
            paperpilot_app.py

      - name: Verify Windows EXE
        id: verify_exe
        shell: pwsh
        run: |
          $exe = "windows/dist/paperpilot.exe"
          if (-not (Test-Path -Path $exe -PathType Leaf)) {
            Write-Error "Expected executable not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          if ($size -le 0) {
            Write-Error "$exe is empty."
            exit 1
          }
          Write-Host "Verified Windows EXE: $exe ($size bytes)"

      - name: Upload Windows EXE artifact
        id: upload_exe_artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperpilot-windows-exe
          path: windows/dist/paperpilot.exe
          if-no-files-found: error

      - name: Prepare Windows EXE release asset
        id: prepare_release_asset
        shell: pwsh
        run: |
          $repoName = ($env:GITHUB_REPOSITORY -split "/")[-1].ToLower()
          $safeRepo = ($repoName -replace "[^a-z0-9._-]+", "-").Trim("._-")
          if ([string]::IsNullOrWhiteSpace($safeRepo)) { $safeRepo = "paperpilot" }

          $assetName = "$safeRepo-windows-build-$($env:GITHUB_RUN_NUMBER).exe"
          $tmpDir = Join-Path $env:RUNNER_TEMP "win-exe-release-$($env:GITHUB_RUN_NUMBER)"
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
          $assetPath = Join-Path $tmpDir $assetName
          Copy-Item -Path "windows/dist/paperpilot.exe" -Destination $assetPath -Force

          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Prepared Windows release asset: $assetName"

      - name: Publish Windows EXE to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: pwsh
        run: |
          gh --version
          if (-not (Test-Path -Path $env:ASSET_PATH -PathType Leaf)) {
            Write-Warning "Prepared Windows EXE asset missing; skipping release."
            exit 1
          }
          $tag = "windows-exe-build-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_RUN_ATTEMPT)"
          $title = "Windows EXE Build #$($env:GITHUB_RUN_NUMBER)"
          $notes = @"
          Standalone Windows desktop build of **paperpilot** generated automatically by GitHub Actions.

          - **Workflow run number:** $($env:GITHUB_RUN_NUMBER)
          - **Workflow run attempt:** $($env:GITHUB_RUN_ATTEMPT)
          - **Source commit SHA:** $($env:GITHUB_SHA)
          - **Windows EXE asset:** ``$($env:ASSET_NAME)``

          Double-click ``$($env:ASSET_NAME)`` on Windows 10/11 to run paperpilot locally—no installation, login, or cloud upload required.
          "@
          gh release create $tag $env:ASSET_PATH `
            --title $title `
            --target $env:GITHUB_SHA `
            --notes $notes

      - name: Report Windows EXE download result
        if: ${{ !cancelled() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: windows-exe-build-${{ github.run_number }}-${{ github.run_attempt }}
        shell: pwsh
        run: |
          if ($env:PUBLISH_OUTCOME -eq "success") {
            $url = gh release view $env:RELEASE_TAG --json url --jq ".url"
            Write-Host "Windows EXE Release URL: $url"
            @(
              "## Windows EXE Download",
              "",
              "- **Release tag:** ``$($env:RELEASE_TAG)``",
              "- **Windows EXE asset:** ``$($env:ASSET_NAME)``",
              "- **Release page:** $url",
              "",
              "The GitHub Actions artifact (``paperpilot-windows-exe``) is also available as a backup."
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            Write-Warning "GitHub Release publishing failed, but the paperpilot-windows-exe Actions artifact remains available."
            @(
              "## Windows EXE Download (Release Warning)",
              "",
              "> **Warning:** Publishing to GitHub Releases failed, but the Windows `.exe` build succeeded.",
              "",
              "Download the standalone ``paperpilot.exe`` from the ``paperpilot-windows-exe`` Actions artifact on this run."
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
